<!-- Wazuh Manager Configuration -->
<ossec_config>
  <!-- Global Configuration -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <!-- Email/webhook alerting stub (ready to configure) -->
    <!--
    <email_notification>yes</email_notification>
    <smtp_server>smtp.example.com</smtp_server>
    <email_from>wazuh@example.com</email_from>
    <email_to>soc@example.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    -->
  </global>

  <!-- Suricata Log Collection -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- Vulnerability Detector -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <min_full_scan_interval>6h</min_full_scan_interval>
    <run_on_start>yes</run_on_start>
    
    <!-- Ubuntu OS sources -->
    <provider name="canonical">
      <enabled>yes</enabled>
      <os>jammy</os>
      <os>focal</os>
      <update_interval>1h</update_interval>
    </provider>
    
    <!-- Windows sources -->
    <provider name="nvd">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <!-- Active Response Configuration (block brute force IPs) -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <expect>srcip</expect>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <!-- Trigger on brute force and critical auth failures -->
    <rules_id>5712, 5710, 5711, 5720, 5551, 5716, 5703, 5704</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- Security Configuration Assessment (SCA) -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <!-- File Integrity Monitoring (FIM) -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <auto_ignore>no</auto_ignore>
    
    <!-- Critical Paths for FIM -->
    <directories check_all="yes">/etc/passwd</directories>
    <directories check_all="yes">/etc/shadow</directories>
    <directories check_all="yes">/etc/hosts</directories>
    <!-- Windows System32 -->
    <directories check_all="yes" restrict="\.exe$|\.dll$|\.sys$">C:\Windows\System32</directories>
  </syscheck>

  <!-- Custom Rules Directory -->
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    
    <!-- Included user directories -->
    <rule_dir>etc/rules</rule_dir>
    <rule_dir>etc/local_rules</rule_dir>
    
    <!-- Custom lab rules include -->
    <include>etc/rules/local_rules.xml</include>
  </ruleset>

  <!-- Debug Settings for Lab -->
  <logging>
    <log_format>plain</log_format>
    <!-- Level set to debug for lab setup visibility -->
    <level>debug</level>
  </logging>
</ossec_config>
