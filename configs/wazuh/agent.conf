<!-- Centralized Agent Configuration -->

<!-- Shared Configuration for All Agents -->
<agent_config>
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
  </syscheck>
</agent_config>

<!-- Windows Agent Group Config -->
<agent_config os="Windows">
  
  <!-- Core Windows Event Channels -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <!-- Exclude noisy network/share events to reduce load -->
    <query>Event/System[EventID != 5145 and EventID != 5156 and EventID != 5447 and EventID != 4656 and EventID != 4658 and EventID != 4663 and EventID != 4660]</query>
  </localfile>
  
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>
  
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Sysmon Operational Channel -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell Logs -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  
  <!-- PowerShell Script Block Logging -->
  <localfile>
    <location>Windows PowerShell</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- File Integrity Monitoring (FIM) for User-Writable Paths -->
  <syscheck>
    <directories check_all="yes" realtime="yes">C:\Users</directories>
    <directories check_all="yes" realtime="yes">C:\ProgramData</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\Temp</directories>
  </syscheck>

  <!-- Security Configuration Assessment (SCA) for Windows -->
  <sca>
    <enabled>yes</enabled>
    <policies>
      <policy>ruleset/sca/cis_win11_enterprise.yml</policy>
    </policies>
  </sca>
</agent_config>

<!-- Linux Agent Group Config -->
<agent_config os="Linux">
  
  <!-- Auth and Syslog -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Auditd Logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- File Integrity Monitoring (FIM) -->
  <syscheck>
    <directories check_all="yes" realtime="yes">/etc/</directories>
    <directories check_all="yes" realtime="yes">/usr/bin/</directories>
    <directories check_all="yes" realtime="yes">/usr/sbin/</directories>
  </syscheck>

  <!-- Security Configuration Assessment (SCA) for Ubuntu -->
  <sca>
    <enabled>yes</enabled>
    <policies>
      <policy>ruleset/sca/cis_ubuntu22-04.yml</policy>
    </policies>
  </sca>
</agent_config>
